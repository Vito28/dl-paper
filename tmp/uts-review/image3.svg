<line x1="320.0" y1="624.0" x2="320.0" y2="654.0" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="320.0" y1="716.0" x2="320.0" y2="746.0" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="110.0" y="10.0" width="420.0" height="62.0" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1.3"/>
<text x="320.0" y="31.0" font-family="Times New Roman, Liberation Serif, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Pengumpulan dan Pemahaman Data (3.2)</text>
<text x="320.0" y="45.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">Amazon Reviews 2023 – User Reviews</text>
<text x="320.0" y="59.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">kategori terpilih dan statistik deskriptif</text>
<rect x="110.0" y="102.0" width="420.0" height="62.0" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1.3"/>
<text x="320.0" y="123.0" font-family="Times New Roman, Liberation Serif, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Preprocessing dan Rekayasa Fitur (3.3)</text>
<text x="320.0" y="137.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">validasi skema dan timestamp, data kosong, duplikasi</text>
<text x="320.0" y="151.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">fitur panjang, usia ulasan, standardisasi</text>
<rect x="110.0" y="194.0" width="420.0" height="62.0" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1.3"/>
<text x="320.0" y="215.0" font-family="Times New Roman, Liberation Serif, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Pembagian Data Product-Disjoint (3.4)</text>
<text x="320.0" y="229.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">per parent_asin, 80% latih, 10% validasi, 10% uji</text>
<text x="320.0" y="243.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">subset bertingkat E1–E5</text>
<rect x="20.0" y="286.0" width="290.0" height="154.0" rx="6" fill="#FFF4E5" stroke="#333" stroke-width="1.3"/>
<text x="165.0" y="332.0" font-family="Times New Roman, Liberation Serif, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Pembentukan Target Helpfulness (3.5)</text>
<text x="165.0" y="346.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">T1 target mentah ln(1 + helpful_vote)</text>
<text x="165.0" y="360.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">analisis usia–suara (Negative Binomial)</text>
<text x="165.0" y="374.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">T2 age-matched pairs</text>
<text x="165.0" y="388.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">T3 target terkoreksi usia (out-of-fold)</text>
<text x="165.0" y="402.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">tingkat relevansi 0–4</text>
<rect x="330.0" y="286.0" width="290.0" height="62.0" rx="6" fill="#E8F0FA" stroke="#333" stroke-width="1.3"/>
<text x="475.0" y="307.0" font-family="Times New Roman, Liberation Serif, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Ekstraksi Embedding BLaIR (3.6)</text>
<text x="475.0" y="321.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">title + text → tokenizer (maks. 512)</text>
<text x="475.0" y="335.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">[CLS] lapisan terakhir, L2 → 768 dimensi</text>
<rect x="330.0" y="378.0" width="290.0" height="62.0" rx="6" fill="#E8F0FA" stroke="#333" stroke-width="1.3"/>
<text x="475.0" y="399.0" font-family="Times New Roman, Liberation Serif, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Feature Fusion (3.7)</text>
<text x="475.0" y="413.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">embedding digabung 5 fitur terstruktur</text>
<text x="475.0" y="427.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">vektor masukan 773 dimensi</text>
<rect x="110.0" y="470.0" width="420.0" height="62.0" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1.3"/>
<text x="320.0" y="491.0" font-family="Times New Roman, Liberation Serif, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Pembentukan Pasangan dan Pelatihan MLP (3.7)</text>
<text x="320.0" y="505.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">pasangan dalam parent_asin yang sama, RankNet, Adam</text>
<text x="320.0" y="519.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">penalaan dan early stopping dengan NDCG@10 validasi</text>
<rect x="110.0" y="562.0" width="420.0" height="62.0" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1.3"/>
<text x="320.0" y="583.0" font-family="Times New Roman, Liberation Serif, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Pembentukan Ranking (3.8)</text>
<text x="320.0" y="597.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">skor per ulasan → urutan menurun per parent_asin</text>
<text x="320.0" y="611.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">pada data uji (produk yang tidak terlihat)</text>
<rect x="110.0" y="654.0" width="420.0" height="62.0" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1.3"/>
<text x="320.0" y="675.0" font-family="Times New Roman, Liberation Serif, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Rancangan Eksperimen dan Evaluasi (3.9)</text>
<text x="320.0" y="689.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">baseline B0–B5, ablasi A1–A4, skala E1–E5, target T1–T3</text>
<text x="320.0" y="703.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">NDCG@10, NDCG@5, Spearman, MAP, bootstrap 95%</text>
<rect x="110.0" y="746.0" width="420.0" height="62.0" rx="6" fill="#E9F5EC" stroke="#333" stroke-width="1.3"/>
<text x="320.0" y="767.0" font-family="Times New Roman, Liberation Serif, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Analisis Hasil dan Kesimpulan (3.10)</text>
<text x="320.0" y="781.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">menjawab RM1–RM3</text>
<text x="320.0" y="795.0" font-family="Times New Roman, Liberation Serif, serif" font-size="11" text-anchor="middle" fill="#222">keterbatasan dan saran</text>
</svg>